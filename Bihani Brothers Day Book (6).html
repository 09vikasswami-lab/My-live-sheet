<script>
(function(){
"use strict";
const HSD_N=7, MS_N=4, DEFAULT_RATE={hsd:99.28, ms:114.13};
const $=s=>document.querySelector(s);
const el=(t,a={},...kids)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k==="text")e.textContent=a[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]);else if(a[k]!==undefined&&a[k]!==null&&a[k]!==false)e.setAttribute(k,a[k]===true?"":a[k]);}for(const c of kids)if(c!=null)e.append(c);return e;};

// ---------- formatting ----------
const inr=n=>(n<0?"−":"")+"₹"+Math.abs(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const ltr=n=>(n<0?"−":"")+Math.abs(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{if(v===""||v===null||v===undefined)return null;const x=parseFloat(String(v).replace(/,/g,""));return isFinite(x)?x:null;};
const z=v=>v==null?0:v;
const r2=x=>Math.round(x*100)/100;
const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${dd}`;};
const parseISO=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);};
const nice=s=>parseISO(s).toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const short=s=>parseISO(s).toLocaleDateString("en-IN",{day:"2-digit",month:"short"});

// ---------- state ----------
// mobile app jaisi jagah jahan download ki suvidha nahi milti: share sheet ya seedha download
const MIME={pdf:"application/pdf",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",csv:"text/csv"};
const FALLBACK_DL={save:async({filename,data})=>{const ext=filename.split(".").pop().toLowerCase();const blob=new Blob([data],{type:MIME[ext]||"application/octet-stream"});
  try{const f=new File([blob],filename,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return{status:"saved"};}}catch(e){if(e&&e.name==="AbortError")return{status:"declined"};}
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=filename;a.rel="noopener";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return{status:"saved"};}};
let db=null, user=null, downloads=FALLBACK_DL, myId=null, canWrite=true, connected=false;
const days=new Map();          // date -> stored doc (from db)
let curDate=iso(new Date());
let cur=null;                  // editable doc for curDate
let dirty=false, saveTimer=null, saving=false, lastSaved="", editSeq=0;
let pendingRemote=null;
const LS={get:k=>{try{return localStorage.getItem(k)||"";}catch(e){return"";}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
const BANK_OPTS=[["","—"],["CA","Current A/c"],["OD","O/D A/c"]];
// Receipt + bank = paisa bank mein AAYA (Credit); "-W" = bank se cash nikala (Debit).
// Payment + bank = bank se DIYA (Debit); "-D" = cash bank mein jama (Credit).
const REC_OPTS=[["","—"],["CA","Current A/c (Cr)"],["OD","O/D A/c (Cr)"],["CA-W","Current A/c (Dr)"],["OD-W","O/D A/c (Dr)"]];
const PAY_OPTS=[["","—"],["CSH","Cash"],["CA","Current A/c (Dr)"],["OD","O/D A/c (Dr)"],["CA-D","Current A/c (Cr)"],["OD-D","O/D A/c (Cr)"]];
const bankLbl=(key,v)=>{const o=(key==="rec"?REC_OPTS:PAY_OPTS).find(x=>x[0]===v);return v&&o?o[1]:"";};
const ACCT_NAME={CA:"Current A/c",OD:"O/D A/c"};
const bankMap=new Map();          // id -> manual bank entry
let bankSet={CA:{},OD:{},stmt:{CA:{},OD:{}}}, bankSetKey="";

function blank(date){return{date,hsd:{open:Array(HSD_N).fill(null),close:Array(HSD_N).fill(null),test:null},ms:{open:Array(MS_N).fill(null),close:Array(MS_N).fill(null),test:null},rate:{hsd:null,ms:null},openBal:null,lube:[],rec:[],pay:[],crH:[],crM:[]};}
function normalize(d,date){const b=blank(date);if(!d)return b;const o=JSON.parse(JSON.stringify(d));
  for(const k of ["hsd","ms"]){const n=k==="hsd"?HSD_N:MS_N;o[k]=o[k]||{};for(const f of ["open","close"]){const a=Array.isArray(o[k][f])?o[k][f]:[];o[k][f]=Array.from({length:n},(_,i)=>a[i]??null);}o[k].test=o[k].test??null;}
  o.rate=Object.assign({hsd:null,ms:null},o.rate||{});o.openBal=o.openBal??null;
  for(const k of ["lube","rec","pay","crH","crM"])o[k]=Array.isArray(o[k])?o[k]:[];
  o.date=date;return o;}
// Order-independent comparison: the server may return keys in a different order than we wrote them.
const sortDeep=x=>Array.isArray(x)?x.map(sortDeep):(x&&typeof x==="object")?Object.keys(x).sort().reduce((o,k)=>(o[k]=sortDeep(x[k]),o),{}):x;
const contentKey=d=>{if(!d)return"";const n=normalize(d,d.date||curDate);delete n.by;delete n.at;
  for(const k of ["lube","rec","pay","crH","crM"])n[k]=n[k].filter(r=>Object.values(r).some(v=>v!=null&&v!==""));
  return JSON.stringify(sortDeep(n));};

// ---------- calculation (mirrors the Excel day sheet) ----------
// Opening readings, opening balance and rates carry forward from the latest earlier saved day.
function calcDay(doc,prev){
  const out={};
  const meter=(k,n)=>{const o=[],sales=[];let tot=0;for(let i=0;i<n;i++){
      let op=doc[k].open[i]; let carried=false;
      if(op==null&&prev){const pc=prev[k].closeEff[i];op=pc!=null?pc:prev[k].openEff[i];carried=op!=null;}
      const cl=doc[k].close[i]; const s=(op!=null&&cl!=null)?r2(cl-op):0; tot+=s;
      o.push({open:op,carried,close:cl,sale:s});}
    return{rows:o,openEff:o.map(r=>r.open),closeEff:o.map(r=>r.close),gross:r2(tot),test:z(doc[k].test),total:r2(tot-z(doc[k].test))};};
  out.hsd=meter("hsd",HSD_N); out.ms=meter("ms",MS_N);
  out.rateH=doc.rate.hsd??(prev?prev.rateH:DEFAULT_RATE.hsd); out.rateHcarried=doc.rate.hsd==null;
  out.rateM=doc.rate.ms??(prev?prev.rateM:DEFAULT_RATE.ms); out.rateMcarried=doc.rate.ms==null;
  const sumQ=a=>r2(a.reduce((s,r)=>s+z(num(r.qty)),0));
  out.crHqty=sumQ(doc.crH); out.crMqty=sumQ(doc.crM);
  out.crHamt=r2(out.crHqty*out.rateH); out.crMamt=r2(out.crMqty*out.rateM);
  out.cashHqty=r2(out.hsd.total-out.crHqty); out.cashMqty=r2(out.ms.total-out.crMqty);
  out.cashHamt=r2(out.cashHqty*out.rateH); out.cashMamt=r2(out.cashMqty*out.rateM);
  out.lube=r2(doc.lube.reduce((s,r)=>s+z(num(r.amt)),0));
  out.rec=r2(doc.rec.reduce((s,r)=>s+z(num(r.amt)),0));
  out.pay=r2(doc.pay.reduce((s,r)=>s+z(num(r.amt)),0));
  out.openBal=doc.openBal??(prev?prev.cih:0); out.openBalCarried=doc.openBal==null;
  out.grand=r2(out.openBal+out.cashHamt+out.cashMamt+out.lube+out.rec);
  out.cih=r2(out.grand-out.pay);
  return out;}

function sortedDates(){return[...days.keys()].sort();}
// compute every saved day in order; return map date->calc
function calcAll(override){
  const res=new Map();let prev=null;
  const ds=new Set(sortedDates()); if(override)ds.add(override.date);
  for(const d of [...ds].sort()){const doc=(override&&override.date===d)?override:normalize(days.get(d),d);const c=calcDay(doc,prev);res.set(d,c);prev=c;}
  return res;}
function calcFor(doc){ // calc for one day using chain
  let prev=null;for(const d of sortedDates()){if(d>=doc.date)break;prev=calcDay(normalize(days.get(d),d),prev);}
  return calcDay(doc,prev);}

// ---------- status ----------
function status(kind,text){$("#sDot").className="dot "+(kind||"");$("#sText").textContent=text;}
function idleStatus(){
  if(!connected){status("err","Not connected — entries on this screen are not saved");return;}
  if(!canWrite){status("","View only");return;}
  const d=days.get(curDate);
  if(dirty)status("busy","Unsaved changes…");
  else if(d&&d.at)status("ok","Saved "+new Date(d.at).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}));
  else status("ok","Not started — type to begin");}

// ---------- rendering: day ----------
function inp(path,val,o={}){
  const e=el("input",{class:"f"+(o.n?" n":""),id:"f-"+path.replace(/\./g,"-"),"data-p":path,inputmode:o.n?"decimal":undefined,placeholder:o.ph||"",list:o.list,autocomplete:"off",disabled:!canWrite||undefined,"aria-label":o.label||path});
  e.value=val==null?"":val; if(o.cls)e.classList.add(o.cls); return e;}
function out(key,cls){return el("td",{class:"out"+(cls?" "+cls:""),"data-o":key});}

function meterCard(k,label,n){
  const t=el("table");
  t.append(el("thead",{},el("tr",{},el("th",{text:"Nozzle"}),el("th",{class:"num",text:"Opening"}),el("th",{class:"num",text:"Closing"}),el("th",{class:"num",text:"Sale (Ltr)"}))));
  const tb=el("tbody");
  for(let i=0;i<n;i++){tb.append(el("tr",{},el("td",{text:`${label} ${i+1}`}),
    el("td",{},inp(`${k}.open.${i}`,cur[k].open[i],{n:1,label:`${label} ${i+1} opening`})),
    el("td",{},inp(`${k}.close.${i}`,cur[k].close[i],{n:1,label:`${label} ${i+1} closing`})),
    out(`${k}.sale.${i}`)));}
  tb.append(el("tr",{},el("td",{text:"Less: Testing"}),el("td"),el("td",{},inp(`${k}.test`,cur[k].test,{n:1,label:`${label} testing litres`})),out(`${k}.testv`)));
  t.append(tb);
  t.append(el("tfoot",{},el("tr",{},el("td",{colspan:3,text:"Total sale"}),out(`${k}.total`))));
  return el("section",{class:"card"},el("h2",{},`Meter reading`,el("span",{class:"tag "+k,text:label})),el("div",{class:"tscroll"},t),
    el("p",{class:"hint",text:"Grey opening figures are carried from the previous day's closing. Type over them only if needed."}));}

function listCard(key,title,cols,addLabel,tagCls){
  const t=el("table");const hr=el("tr");for(const c of cols)hr.append(el("th",{class:c.n||c.calc?"num":"",text:c.h}));hr.append(el("th"));
  t.append(el("thead",{},hr));const tb=el("tbody");
  cur[key].forEach((row,i)=>{const tr=el("tr");
    for(const c of cols){
      if(c.calc)tr.append(out(`${key}.${i}.${c.calc}`));
      else if(c.sel&&c.f==="bank"&&row.stm){tr.append(el("td",{class:c.w||""},el("span",{class:"chip",title:"Bank statement se aayi entry",text:"🏦 Statement ("+(String(row.stm).startsWith("OD")?"O/D":"CA")+")"})));}
      else if(c.sel){const td=el("td",{class:c.w||""});const se=el("select",{class:"f",id:`f-${key}-${i}-${c.f}`,"data-p":`${key}.${i}.${c.f}`,disabled:!canWrite||undefined,"aria-label":`${title} row ${i+1} ${c.h}`},...c.sel.map(([v,t])=>el("option",{value:v,text:t})));se.value=row[c.f]||"";td.append(se);tr.append(td);}
      else{const td=el("td",{class:c.w||""});td.append(inp(`${key}.${i}.${c.f}`,row[c.f],{n:c.n,list:c.list,ph:c.phFn?c.phFn(row,i):c.ph,label:`${title} row ${i+1} ${c.h}`}));tr.append(td);}}
    tr.append(el("td",{},canWrite?el("button",{class:"rowdel","aria-label":"Remove row",title:"Remove row",onclick:()=>{cur[key].splice(i,1);touch();renderDay();}},"×"):null));
    tb.append(tr);});
  if(!cur[key].length)tb.append(el("tr",{},el("td",{colspan:cols.length+1,class:"hint",text:"No entries yet."})));
  t.append(tb);
  const totCol=cols.findIndex(c=>c.total);
  if(totCol>=0){const fr=el("tr");cols.forEach((c,j)=>{if(j===totCol)fr.append(out(`${key}.total`));else if(j===0&&totCol!==0)fr.append(el("td",{text:"Total"}));else fr.append(el("td"));});fr.append(el("td"));t.append(el("tfoot",{},fr));}
  const h=el("h2",{},title);if(tagCls)h.append(el("span",{class:"tag "+tagCls,text:tagCls.toUpperCase()}));
  return el("section",{class:"card"},h,el("div",{class:"tscroll"},t),
    canWrite?el("button",{class:"btn small addrow",onclick:()=>{const r={};cols.forEach(c=>{if(c.f)r[c.f]=null;});cur[key].push(r);touch();renderDay();const ins=document.querySelectorAll(`[data-p^="${key}.${cur[key].length-1}."]`);if(ins[0])ins[0].focus();}},"+ "+addLabel):null);}

function renderDay(){
  const body=$("#dayBody");const keep=document.activeElement&&document.activeElement.id;
  body.replaceChildren();

  db.collection("bank").limit(1000).onSnapshot(snap=>{for(const ch of snap.docChanges()){if(ch.type==="removed")bankMap.delete(ch.doc.id);else bankMap.set(ch.doc.id,JSON.parse(JSON.stringify(ch.doc.data())));}refreshLists();bankRefresh();},()=>{});
  db.collection("tanker").limit(1000).onSnapshot(snap=>{for(const ch of snap.docChanges()){if(ch.type==="removed")tankMap.delete(ch.doc.id);else tankMap.set(ch.doc.id,JSON.parse(JSON.stringify(ch.doc.data())));}tankRefresh();soRefresh();},()=>{});
  db.collection("soReports").limit(500).onSnapshot(snap=>{for(const ch of snap.docChanges()){if(ch.type==="removed")soHist.delete(ch.doc.id);else{const d=ch.doc.data();soHist.set(ch.doc.id,{id:ch.doc.id,from:d.from,to:d.to,set:d.set?JSON.parse(JSON.stringify(d.set)):null,files:JSON.parse(JSON.stringify(Array.isArray(d.files)?d.files:(d.set&&d.set.files)||[])),result:JSON.parse(JSON.stringify(d.result||{hsd:{},ms:{}}))});}}soRefresh();},()=>{});
  db.doc("settings/so").onSnapshot(sn=>{if(!sn.exists)return;const d=JSON.parse(JSON.stringify(sn.data()));if(soPending||soKey(d)===soLastW||soKey(d)===soKey(soSet))return;soSet=soNorm(d);soRefresh();},()=>{});
  db.doc("settings/dsr").onSnapshot(sn=>{if(!sn.exists)return;const d=JSON.parse(JSON.stringify(sn.data()));if(dsrPend||dsrKey(d)===dsrLastW||dsrKey(d)===dsrKey(dsrSet))return;dsrSet={base:d.base||"",hsd:{dip:d.hsd?d.hsd.dip??null:null},ms:{dip:d.ms?d.ms.dip??null:null}};soRefresh();},()=>{});
  db.doc("settings/bank").onSnapshot(sn=>{if(sn.exists){const o=JSON.parse(JSON.stringify(sn.data()));delete o.by;delete o.at;bankSet=Object.assign({CA:{},OD:{},stmt:{}},o);bankSet.stmt=Object.assign({CA:{},OD:{}},bankSet.stmt||{});}bankRefresh();},()=>{});
})();
})();
</script>
